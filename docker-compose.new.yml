version: "3.9"

services:
  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    volumes:
      - ./ai/src:/app/ai/src
      - ./service/src:/app/service/src
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME:-llama-3.3-70b-versatile}
    env_file:
      - .env
    command: uvicorn service.src.api:app --host 0.0.0.0 --port 8000 --reload
