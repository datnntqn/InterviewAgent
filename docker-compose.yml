version: "3.9"

services:
  app:
    build: .
    volumes:
      - ./src:/app/src
    environment:
      # Groq API configuration
      # Make sure to set GROQ_API_KEY in your .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME:-llama-3.3-70b-versatile}
    env_file:
      - .env
    ports:
      - "8000:8000"
